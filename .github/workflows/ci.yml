name: qicn-ci

on:
  push:
    branches: ["main", "codex/**", "selfpatch/**", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-test:
    name: ci/build-test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # FIX 2026-09-07: el job ejecuta `npm test` (146 tests) que incluye
      # selfpatch-policy-check.v415, el cual exige QICN_KILLSWITCH definido
      # cuando CI=true (seteado automáticamente por Actions). Sin este env el
      # job fallaba siempre en remoto y pasaba en local. Mismo patrón ya usado
      # en el job ci/selfpatch-policy-check de este archivo.
      QICN_KILLSWITCH: ${{ vars.QICN_KILLSWITCH || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint no-undef blocking, warnings <= 50)
        run: npm run lint

      - name: Verify source of truth
        run: npm run verify:source-of-truth

      - name: Verify module inventory is up to date
        run: node scripts/build-module-inventory.mjs --check

      - name: Verify framework summary is up to date
        run: node scripts/build-framework-summary.mjs --check

      - name: Verify descriptor registry
        run: npm run verify:descriptor-registry

      - name: Verify operational readiness contract
        run: npm run verify:operational-readiness

      - name: Build
        run: npm run build

      - name: Smoke operational readiness
        run: npm run smoke:operational

      - name: Test
        run: npm test

  selfpatch-policy-check:
    name: ci/selfpatch-policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QICN_KILLSWITCH: ${{ vars.QICN_KILLSWITCH || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate selfpatch policy and killswitch
        run: node tests/selfpatch-policy-check.v415.test.js

  bridge-verify:
    name: ci/bridge-verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      # Bridge gate (read-only): import drift integrity + bidirectional
      # traceability + G1 candidate-export self-test. The framework root is not
      # present in CI, so the drift check evaluates LOCAL integrity only and
      # skips the upstream comparison (reported, non-blocking by design).
      - name: Verify framework<->runtime bridge
        run: npm run bridge:verify
